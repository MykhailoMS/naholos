[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "naholos"
version = "0.1.0"
description = "Ukrainian word stress (наголос): dictionary + fast neural tagger"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mykhailo Mulesa" }]
keywords = ["ukrainian", "stress", "accent", "наголос", "tts", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: Ukrainian",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "safetensors>=0.4",
  "huggingface-hub>=0.23",
  "numpy>=1.24",
  "ukrainian-word-stress>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
naholos = "naholos.cli:main"

[project.urls]
Repository = "https://github.com/MykhailoMS/naholos"
Issues = "https://github.com/MykhailoMS/naholos/issues"
Model = "https://huggingface.co/Mikhailo/naholos-tagger"

[tool.hatch.build.targets.sdist]
include = ["src/naholos", "tests", "examples", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/naholos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the released model and the Stanza models (network on first run)"]
